<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mausam · Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<meta name="theme-color" content="#0C1622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<script>
/* Request only the font scripts this viewer actually needs. Runs inline and
   before the stylesheet so the request starts in the first parse, and reads
   the same localStorage key i18n.js persists the locale under. */
(function () {
  var loc = 'en';
  try { loc = (JSON.parse(localStorage.getItem('mausam.state.v1')) || {}).locale || 'en'; } catch (e) {}
  var fams = ['Noto+Sans:wght@300;400;500;600;700', 'Noto+Serif+Devanagari:wght@500;600'];
  if (loc === 'bn') fams.push('Noto+Sans+Bengali:wght@400;500;600;700');
  if (loc === 'ta') fams.push('Noto+Sans+Tamil:wght@400;500;600;700');
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=' + fams.join('&family=') + '&display=swap';
  document.head.appendChild(l);
  document.documentElement.lang = loc;

  /* Dusk before the first paint, so nothing flashes bright and then dims.
     This is a clock-only estimate — 17:45 to 21:00 going down, 04:15 to
     07:15 coming back up — and home.js recomputes it against the location's
     real sunrise and sunset the moment the forecast lands. */
  var mins = new Date().getHours() * 60 + new Date().getMinutes();
  var dusk = mins >= 1065 ? Math.min(1, (mins - 1065) / 195)
           : mins <= 435 ? 1 - Math.max(0, (mins - 255) / 180)
           : 0;
  /* Sunset sits 45/195 of the way down the evening ramp; that is where the
     palette changes sides, and --deep measures how far past it we are. */
  var night = dusk >= 45 / 195 ? 1 : 0;
  var deep = Math.min(1, Math.max(0, (dusk - 45 / 195) / (1 - 45 / 195)));
  var el = document.documentElement;
  el.style.setProperty('--dusk', dusk.toFixed(3));
  el.style.setProperty('--night', String(night));
  el.style.setProperty('--deep', deep.toFixed(3));
  el.dataset.theme = night ? 'dark' : 'light';
  var mc = document.querySelector('meta[name="theme-color"]');
  if (mc) {
    var mix = function (f, t) { return Math.round(f + (t - f) * deep).toString(16).padStart(2, '0'); };
    mc.setAttribute('content', night ? '#' + mix(0x22, 0x10) + mix(0x30, 0x18) + mix(0x47, 0x25) : '#F5F4EF');
  }

  /* Sits behind the iOS status bar text. Added here rather than in each
     page's body so there is one copy of it. */
  document.addEventListener('DOMContentLoaded', function () {
    var sc = document.createElement('div');
    sc.className = 'status-scrim';
    document.body.appendChild(sc);
  });
})();
</script>
<link rel="stylesheet" href="./css/styles.css">
<!-- defer: without it these two block HTML parsing, so on a phone the whole
     radar screen stays blank until ~300 KB of map libraries has arrived and
     the page feels like it ignored your tap. Deferred classic scripts still
     run before the module below, in document order. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  body{background:#0C1622}
  .app-shell.dark{background:#0C1622;box-shadow:0 35px 80px -10px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.12), 0 0 0 8px #131E2C}
  .radar-header{padding:54px 20px 12px}
  @media (max-width:440px){
    .radar-header{padding-top:max(18px, calc(6px + env(safe-area-inset-top, 0px)))}
  }
  .radar-header-row{display:flex;align-items:center;justify-content:space-between}
  .radar-title{display:flex;align-items:baseline;gap:8px}
  .radar-title .en{font-size:20px;font-weight:700;color:#fff}
  .radar-title .hi{font-family:'Noto Serif Devanagari',serif;font-size:14px;color:rgba(255,255,255,.6)}
  .radar-back{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;transition:all .15s}
  .radar-back:hover{background:rgba(255,255,255,.1);color:#fff}
  .radar-sub{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:5px}
  .layer-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 12px}
  /* min-height + centring lifts these to a comfortable touch target; at the
     old 34px they were easy to miss with a thumb. */
  .layer-chip{flex:none;display:flex;align-items:center;min-height:42px;padding:0 15px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:rgba(255,255,255,.72);transition:all .18s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .layer-chip:active{transform:scale(.95)}
  .layer-chip:hover{background:rgba(255,255,255,.14);color:#fff}
  .layer-chip.on{background:#F5F4EF;color:#0C1622;border-color:#F5F4EF}
  .map-panel{position:relative;flex:1;min-height:420px;margin:0 14px;border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 10%,#16283C,#0A121C 70%);border:1px solid rgba(255,255,255,.10)}
  .legend{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;background:rgba(10,18,28,.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
  .legend-title{font-size:8.5px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.72)}
  .legend-ramp{width:96px;height:7px;border-radius:4px}
  .legend-ticks{display:flex;justify-content:space-between;font-size:9px;font-weight:600;color:rgba(255,255,255,.72)}
  /* Named categories stack instead of sitting under a ramp: four words do
     not fit across 96px, and a colour you have to match against a gradient
     by eye is not a legend. */
  .legend-bands{display:flex;flex-direction:column;gap:4px}
  .legend-band{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:600;color:rgba(255,255,255,.82)}
  .legend-band i{width:9px;height:9px;border-radius:2.5px;flex:none;font-style:normal}
  .legend-band em{font-style:normal;color:rgba(255,255,255,.5);margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums}
  .range-badge{position:absolute;right:12px;top:12px;background:rgba(10,18,28,.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:7px 11px;font-size:10px;font-weight:600;color:rgba(255,255,255,.72)}
  .controls{padding:14px 20px 6px}
  .controls-row{display:flex;align-items:center;gap:12px}
  .play-btn{width:38px;height:38px;flex:none;border-radius:19px;background:#F5F4EF;color:#0C1622;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s}
  .play-btn:active{transform:scale(.92)}
  .slider-wrap{flex:1;min-width:0}
  .slider-ticks{display:flex;justify-content:space-between;font-size:9.5px;font-weight:600;color:rgba(255,255,255,.6);margin-top:-2px}
  input[type=range]{-webkit-appearance:none;width:100%;height:26px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:rgba(255,255,255,.22)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#F5F4EF;border:3px solid #4FB8C9;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-track{height:6px;border-radius:4px;background:rgba(255,255,255,.28)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#F5F4EF;border:3px solid #4FB8C9}
  .nowcast-card{margin-top:12px;display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:rgba(201,119,42,.16);border:1px solid rgba(226,163,80,.38)}
  .nowcast-badge{width:22px;height:22px;flex:none;border-radius:7px;background:#E2A350;color:#2A1B06;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .nowcast-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:#F0C889}
  .nowcast-body{font-size:12.5px;line-height:1.45;color:#F5EFE3;margin-top:3px}
  .radar-content{display:flex;flex-direction:column;min-height:874px;padding-bottom:96px}
  @media (max-width:440px){
    /* On a real phone, fit the actual viewport instead of the 874px
       design-frame height — otherwise the layout runs taller than the
       screen and the nowcast card ends up behind the fixed nav bar.
       dvh tracks iOS Safari's collapsing address bar; vh is the fallback. */
    .radar-content{min-height:100vh;min-height:100dvh}
  }

  @keyframes pulseRing {
    0% { r: 5px; opacity: 0.85; }
    50% { r: 14px; opacity: 0; }
    100% { r: 5px; opacity: 0; }
  }
  .pulse-ring {
    animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
  }
</style>
</head>
<body>
<div class="app-shell dark" id="app-root">
  <div id="status-bar-wrap"></div>
  <div class="radar-content">
    <div class="radar-header">
      <div class="radar-header-row">
        <div class="radar-title"><span class="en">Radar</span><span class="hi">रडार</span></div>
        <a class="radar-back" href="./index.html">← Home</a>
      </div>
      <div class="radar-sub"><span id="radar-sub-prefix">Simulated radar</span> · <span id="city-label">New Delhi (Palam)</span> · <span id="stamp">now</span></div>
    </div>

    <div class="layer-chips" id="layer-chips">
      <div class="layer-chip on" data-layer="rain">Rainfall</div>
      <div class="layer-chip" data-layer="cloud">Cloud cover</div>
      <div class="layer-chip" data-layer="lightning">Lightning</div>
      <div class="layer-chip" data-layer="wind">Wind</div>
    </div>

    <div class="map-panel">
      <svg id="map" style="position:absolute;inset:0;width:100%;height:100%"></svg>
      <div class="legend">
        <div class="legend-title" id="legTitle">RAINFALL mm/h</div>
        <div class="legend-ramp" id="legRamp" style="background:linear-gradient(90deg,#4FB8C9,#3E8FD8,#7A5AA8,#C2452D)"></div>
        <div class="legend-ticks" id="legTicks"><span>2.5</span><span>15</span><span>65+</span></div>
      </div>
      <div class="range-badge">Range 250 km</div>
    </div>

    <div class="controls">
      <div class="controls-row">
        <div class="play-btn" id="play" title="Play animation">▶</div>
        <div class="slider-wrap">
          <input id="time" type="range" min="-30" max="120" step="5" value="0" aria-label="Radar timeline slider">
          <div class="slider-ticks"><span>−30 min</span><span>NOW</span><span>+2 h nowcast</span></div>
        </div>
      </div>
      <div class="nowcast-card">
        <div class="nowcast-badge">!</div>
        <div>
          <div class="nowcast-eyebrow">NOWCAST · NEXT 2 HOURS</div>
          <div class="nowcast-body" id="cellText">Loading Doppler cells…</div>
        </div>
      </div>
    </div>

    <div id="nav-wrap"></div>
  </div>
  <div class="home-indicator"></div>
</div>
<script type="module" src="./js/radarApp.js"></script>
</body>
</html>
