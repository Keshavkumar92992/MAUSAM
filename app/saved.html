<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Mausam · Tracked and saved meteorological stations">
<title>Mausam · Saved</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<script>
/* Request only the font scripts this viewer actually needs. Runs inline and
   before the stylesheet so the request starts in the first parse, and reads
   the same localStorage key i18n.js persists the locale under. */
(function () {
  var loc = 'en';
  try { loc = (JSON.parse(localStorage.getItem('mausam.state.v1')) || {}).locale || 'en'; } catch (e) {}
  var fams = ['Noto+Sans:wght@300;400;500;600;700', 'Noto+Serif+Devanagari:wght@500;600'];
  if (loc === 'bn') fams.push('Noto+Sans+Bengali:wght@400;500;600;700');
  if (loc === 'ta') fams.push('Noto+Sans+Tamil:wght@400;500;600;700');
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=' + fams.join('&family=') + '&display=swap';
  document.head.appendChild(l);
  document.documentElement.lang = loc;

  /* Theme before first paint, so no page flashes light and then goes dark.
     'auto' uses a plain clock guess here; home.js refines it against the
     location's real sunrise/sunset once the forecast has loaded. */
  var mode = 'auto';
  try { mode = (JSON.parse(localStorage.getItem('mausam.state.v1')) || {}).theme || 'auto'; } catch (e) {}
  var h = new Date().getHours();
  var dark = mode === 'dark' || (mode === 'auto' && (h < 6 || h >= 19));
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  var mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute('content', dark ? '#101825' : '#F5F4EF');
})();
</script>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div class="app-shell" id="app-root"></div>
<script type="module" src="./js/savedApp.js"></script>
</body>
</html>
